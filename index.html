<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Web UI</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --chat-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --input-bg: #3d3d3d;
            --accent-color: #d97757; /* Claude-like accent */
            --border-color: #444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 300px;
            background-color: var(--chat-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #sidebar h2 { margin-top: 0; font-size: 1.2rem; }
        label { font-size: 0.9rem; font-weight: bold; }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        #chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .user-message {
            background-color: var(--input-bg);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .ai-message {
            background-color: var(--chat-bg);
            align-self: flex-start;
            border-bottom-left-radius: 0;
            border: 1px solid var(--border-color);
        }
        #input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background-color: var(--bg-color);
        }
        #user-input {
            flex-grow: 1;
            padding: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            resize: none;
            height: 24px;
        }
        button {
            padding: 0 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover { background-color: #c4674a; }
        .loading { font-style: italic; color: #aaa; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>API Settings</h2>
        <div>
            <label for="api-key">API Key (sk-...)</label>
            <input type="password" id="api-key" placeholder="Paste your API key here">
        </div>
        <div>
            <label for="model-id">Model</label>
            <input type="text" id="model-id" value="claude-sonnet-5">
        </div>
        <p style="font-size: 0.8rem; color: #888;">
            Endpoint configured for: <br>https://api.mwapi.dev/v1
        </p>
    </div>

    <div id="main">
        <div id="chat-window">
            <div class="message ai-message">Hello! Enter your API key in the sidebar and send a message to start.</div>
        </div>
        <div id="input-area">
            <textarea id="user-input" placeholder="Type your message here..."></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');
        const modelInput = document.getElementById('model-id');

        let chatHistory = [];

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}-message`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const model = modelInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("Please enter your API Key in the sidebar.");
                return;
            }

            appendMessage('user', text);
            userInput.value = '';
            
            chatHistory.push({ role: "user", content: text });

            const loadingMsg = appendMessage('ai', 'Thinking...');
            loadingMsg.classList.add('loading');

            try {
                const response = await fetch('https://api.mwapi.dev/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: chatHistory,
                        stream: false
                    })
                });

                const data = await response.json();
                
                loadingMsg.remove();

                if (response.ok && data.choices && data.choices.length > 0) {
                    const aiText = data.choices[0].message.content;
                    appendMessage('ai', aiText);
                    chatHistory.push({ role: "assistant", content: aiText });
                } else {
                    appendMessage('ai', `Error: ${data.error ? data.error.message : 'Failed to fetch response'}`);
                }
            } catch (error) {
                loadingMsg.remove();
                appendMessage('ai', `Connection Error: ${error.message}`);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
